<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="demo.css" />
    <style>
      html,
      body {
        width: 1200px;
        height: 800px;
      }
      body {
        background:
          radial-gradient(70% 90% at 8% 0%, #2a1f24 0%, transparent 55%),
          radial-gradient(60% 80% at 100% 100%, #1d2233 0%, transparent 60%),
          #0f1115;
      }
      .cover {
        width: 1200px;
        height: 800px;
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 0 64px;
      }
      .copy {
        width: 620px;
        flex: none;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--label3);
        margin-bottom: 22px;
      }
      h1 {
        margin: 0 0 22px;
        font-size: 56px;
        line-height: 60px;
        font-weight: 600;
        letter-spacing: -0.025em;
        color: var(--label);
      }
      .sub {
        margin: 0 0 34px;
        max-width: 500px;
        font-size: 19px;
        line-height: 30px;
        color: var(--label2);
      }
      .ramp {
        display: flex;
        gap: 8px;
        margin-bottom: 40px;
      }
      .ramp span {
        width: 44px;
        height: 10px;
        border-radius: 999px;
      }
      .byline {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--label3);
      }
      .byline b {
        color: var(--label2);
        font-weight: 500;
      }
      .shot {
        flex: 1;
        display: flex;
        justify-content: center;
      }
      .shot img {
        width: 320px;
        height: 620px;
        border-radius: 16px;
        border: 1px solid #ffffff14;
        box-shadow: 0 30px 80px #00000080, 0 2px 0 #ffffff0d inset;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <div class="copy">
        <div class="eyebrow">DeepSeek Harness plugin</div>
        <h1>Workspace Tints</h1>
        <p class="sub">
          A quiet colour code for every Workspace, a sidebar that reads as a
          tree, and a green row the moment a chat finishes while you are away.
        </p>
        <div class="ramp">
          <span style="background: oklch(0.62 0.052 8)"></span>
          <span style="background: oklch(0.62 0.052 246)"></span>
          <span style="background: oklch(0.62 0.052 300)"></span>
          <span style="background: oklch(0.62 0.052 40)"></span>
          <span style="background: oklch(0.62 0.052 210)"></span>
          <span style="background: #22c55e"></span>
        </div>
        <div class="byline">
          <b>Veduis</b><span>·</span><span>veduis.com</span>
        </div>
      </div>
      <div class="shot">
        <img src="../screenshots/sidebar-dark.png" alt="Workspace Tints sidebar" />
      </div>
    </div>
  </body>
</html>
